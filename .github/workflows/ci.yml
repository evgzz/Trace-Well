name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (G7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked repository for high-confidence credentials
        run: python scripts/check_secrets.py

  deterministic-v1-5:
    name: Deterministic V1.5 Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Scan public text
        run: python scripts/check_public_text.py

  po9-clean-reproduction:
    name: PO-9 Clean-Runner Reproduction
    needs: [deterministic-v1-5, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run PO-9 clean-runner reproduction
        run: python scripts/reproduce_po9.py

      - name: Upload PO-9 reproduction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: po9-reproduction-report
          path: results/reproduction/po9-reproduction-report.json
          if-no-files-found: error
