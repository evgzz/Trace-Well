name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-v1-5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Scan public text
        run: python scripts/check_public_text.py
