[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-well"
version = "1.5.0"
description = "Paired behavioral-delta evaluation harness for longitudinal AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
tracewell = "tracewell.cli:app"

[tool.setuptools.packages.find]
include = ["tracewell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
